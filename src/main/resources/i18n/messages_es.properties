settings.tooltip.minBoundingBoxSize=Longitud mínima del lado (en píxeles) de un recuadro de cara detectado; las caras más pequeñas se descartan durante la importación.\n\nPredeterminado: %s px.\n\nLos valores más altos conservan solo caras más grandes (por lo general más cercanas), menos falsos positivos, pero se pierden caras pequeñas o lejanas. Los valores más bajos también conservan caras pequeñas o lejanas, lo que añade ruido y ralentiza el procesamiento.
settings.tooltip.minConfidence=Puntuación de confianza mínima que debe tener una cara detectada para almacenarse; las detecciones por debajo de este valor se descartan durante la importación.\n\nPredeterminado: %s.\n\nLos valores más altos solo aceptan detecciones muy seguras, reduciendo falsos positivos pero posiblemente omitiendo caras reales. Los valores más bajos conservan más caras, incluidas las inciertas.
settings.tooltip.maxFacesPerImage=Número máximo de caras almacenadas por imagen importada. Cuando una imagen contiene más caras, solo se conservan las más seguras.\n\nPredeterminado: %s.\n\nLos valores más altos conservan más caras de fotos de grupo a costa de más datos. Los valores más bajos almacenan menos caras y pueden omitir personas en fotos concurridas.
settings.tooltip.clusteringThreshold=Similitud mínima entre dos caras sin nombre para que se agrupen en el mismo grupo en la pestaña «Poner nombre a una cara».\n\nPredeterminado: %s.\n\nLos valores más altos agrupan solo caras muy similares, dando grupos más pequeños y precisos, pero una misma persona puede dividirse en varios grupos. Los valores más bajos fusionan más caras y pueden mezclar personas distintas.
settings.tooltip.hnswM=Número de enlaces conservados por nodo en el índice HNSW usado para encontrar caras similares durante el agrupamiento.\n\nPredeterminado: %s.\n\nLos valores más altos mejoran la precisión de la búsqueda de vecinos a costa de más memoria y una construcción de índice más lenta. Los valores más bajos construyen más rápido y usan menos memoria, pero pueden omitir vecinos reales.
settings.tooltip.hnswEfConstruction=Cuántos nodos candidatos considera HNSW al construir los enlaces de cada nodo. Equilibra el tiempo de construcción del índice frente a la calidad de búsqueda.\n\nPredeterminado: %s.\n\nLos valores más altos construyen un índice más preciso, pero tardan más y usan más memoria. Los valores más bajos construyen más rápido con un índice menos preciso.
settings.tooltip.hnswEfSearch=Cuántos nodos candidatos examina HNSW en cada búsqueda de vecinos realizada durante el agrupamiento.\n\nPredeterminado: %s.\n\nLos valores más altos dan búsquedas más precisas pero son más lentos. Los valores más bajos son más rápidos pero pueden omitir vecinos reales.
settings.tooltip.knnK=Número de vecinos más cercanos consultados para cada cara al enlazar caras en grupos.\n\nPredeterminado: %s.\n\nLos valores más altos pueden conectar caras más distantes en un grupo, lo que es más lento y puede mezclar personas distintas. Los valores más bajos son más rápidos pero solo enlazan caras muy cercanas.
settings.tooltip.faceaiCacheDir=Directorio donde FaceAI almacena los modelos de detección y reconocimiento de caras descargados. Los modelos se descargan en el primer uso y se reutilizan desde esta carpeta después.\n\nPredeterminado: en blanco, que usa la ubicación de caché integrada de FaceAI (p. ej. ~/.djl.ai/cache).\n\nEste ajuste no tiene rango alto/bajo: déjelo en blanco para la ubicación predeterminada o introduzca una ruta para controlar dónde viven los modelos.
settings.tooltip.maxDetectionDimension=Mayor ancho/alto (en píxeles) que puede tener una imagen antes de reducirse antes de ejecutar la detección de caras.\n\nPredeterminado: %s px.\n\nLos valores más altos detectan con más fiabilidad caras pequeñas o lejanas en fotos enormes, pero usan más memoria y tardan mucho más. Los valores más bajos hacen la detección rápida y barata en fotos de alta resolución, con el riesgo de perder caras muy pequeñas.
settings.tooltip.thumbnailSize=Ancho/alto máximo (en píxeles) de la miniatura de imagen completa almacenada para cada imagen importada.\n\nPredeterminado: %s px.\n\nLos valores más altos dan vistas previas más nítidas pero archivos de base de datos más grandes. Los valores más bajos mantienen la base de datos más pequeña a costa de la calidad de la vista previa.
settings.tooltip.maxImportThreads=Número de hilos de trabajo paralelos usados al importar archivos de imagen. Se aplica a la siguiente importación.\n\nPredeterminado: %s.\n\nLos valores más altos importan más rápido en máquinas de varios núcleos, pero aumentan el uso de CPU y memoria. Los valores más bajos son más suaves con el sistema pero más lentos.
settings.tooltip.minNameSimilarity=Similitud mínima con la incrustación media de un nombre para que una cara se ofrezca al añadir caras a un nombre existente en la pestaña «Añadir caras a un nombre».\n\nPredeterminado: %s.\n\nLos valores más altos solo permiten caras muy similares, evitando añadidos erróneos. Los valores más bajos ofrecen más candidatos, pero con riesgo de añadir a otra persona.
settings.tooltip.faceNameMaxImages=Número máximo de caras sin nombre similares mostradas como candidatas en la pestaña «Añadir caras a un nombre».\n\nPredeterminado: %s.\n\nLos valores más altos muestran más caras candidatas, mientras que los valores más bajos mantienen la cuadrícula más pequeña.
settings.tooltip.updateCheckEnabled=Si Face Sort comprueba el repositorio de GitHub del proyecto en busca de una nueva versión al iniciar la aplicación y muestra un aviso cuando hay una disponible.\n\nPredeterminado: %s.\n\nDeshabilitarlo también omite la solicitud de red al iniciar.
