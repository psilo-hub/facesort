settings.faceaiCacheDirPrompt=Leave blank for the default cache location

settings.tooltip.minBoundingBoxSize=Minimum side length (in pixels) of a detected face box; faces smaller than this are discarded during import.\n\nDefault: %s px.\n\nHigher values keep only larger (usually nearer) faces, so fewer false positives but small or distant faces are missed. Lower values also keep small or distant faces, which adds noise and slows processing.
settings.tooltip.minConfidence=Minimum confidence score a detected face must have to be stored; detections scoring below this are discarded during import.\n\nDefault: %s.\n\nHigher values only accept very certain detections, cutting false positives but possibly skipping genuine faces. Lower values keep more faces, including uncertain ones.
settings.tooltip.maxFacesPerImage=Maximum number of faces stored per imported image. When an image contains more faces, only the most confident ones are kept.\n\nDefault: %s.\n\nHigher values keep more faces from group photos at the cost of more data. Lower values store fewer faces and can drop people in crowded pictures.
settings.tooltip.clusteringThreshold=Minimum similarity between two unnamed faces for them to be grouped into the same cluster in the "Put a name to a face" tab.\n\nDefault: %s.\n\nHigher values group only very similar faces, giving smaller and more precise clusters, but a single person may be split into several clusters. Lower values merge more faces and can mix different people together.
settings.tooltip.hnswM=Number of links kept per node in the HNSW index used to find similar faces during clustering.\n\nDefault: %s.\n\nHigher values improve neighbor-search accuracy at the cost of more memory and a slower index build. Lower values build faster and use less memory but can miss true neighbors.
settings.tooltip.hnswEfConstruction=How many candidate nodes HNSW considers while building each node's links. Trades index build time against search quality.\n\nDefault: %s.\n\nHigher values build a more accurate index but take longer and use more memory. Lower values build more quickly with a less accurate index.
settings.tooltip.hnswEfSearch=How many candidate nodes HNSW examines during each neighbor search performed at clustering time.\n\nDefault: %s.\n\nHigher values give more accurate searches but run slower. Lower values run faster but can miss true neighbors.
settings.tooltip.knnK=Number of nearest neighbors queried for each face when linking faces into clusters.\n\nDefault: %s.\n\nHigher values can connect more distant faces into a cluster, which is slower and may merge different people. Lower values run faster but only link very close faces.
settings.tooltip.faceaiCacheDir=Directory where FaceAI stores the downloaded face-detection and recognition models. Models are fetched on first use and reused from this folder afterwards.\n\nDefault: blank, which uses FaceAI's built-in cache location (e.g. ~/.djl.ai/cache).\n\nThis setting has no higher/lower range: leave it blank for the default location or enter a path to control where models live.
settings.tooltip.maxDetectionDimension=Largest width/height (in pixels) an image may have before it is scaled down before face detection runs.\n\nDefault: %s px.\n\nHigher values detect small or distant faces in huge photos more reliably but use more memory and take much longer. Lower values make detection fast and cheap on high-resolution photos at the risk of missing very small faces.
settings.tooltip.thumbnailSize=Maximum width/height (in pixels) of the full-image thumbnail stored for each imported image.\n\nDefault: %s px.\n\nHigher values give sharper previews but larger database files. Lower values keep the database smaller at the cost of preview quality.
settings.tooltip.thumbnailQuality=JPEG quality for every stored thumbnail and face sub-image. Valid range is 0.1 to 1.0.\n\nDefault: %s.\n\nHigher values give sharper previews but larger database files. Lower values keep the database smaller at the cost of preview quality.
settings.tooltip.maxFramesPerVideo=Maximum number of frames extracted for each imported video, sampled at up to one frame per second.\n\nDefault: %s.\n\nHigher values cover long videos in more detail but make video import much slower and store more frame faces. Lower values speed up video import and save space, at the risk of missing faces that appear only briefly.
settings.tooltip.faceCropSize=Maximum width/height (in pixels) of the square crop stored for each detected face after downscaling.\n\nDefault: %s px.\n\nHigher values keep more detail for embedding and reviewing but increase the database size and slow import. Lower values store smaller face images, which can lower detection and recognition quality.
settings.tooltip.maxImportThreads=Number of parallel worker threads used when importing image files. Applies to the next import.\n\nDefault: %s.\n\nHigher values import faster on multi-core machines but increase CPU and memory use. Lower values are gentler on the system but slower.
settings.tooltip.minNameSimilarity=Minimum similarity to a name's average embedding for a face to be offered when adding faces to an existing name in the "Add faces to a name" tab.\n\nDefault: %s.\n\nHigher values only allow very similar faces, avoiding wrong additions. Lower values offer more candidates but risk adding a different person.
settings.tooltip.faceNameMaxImages=Maximum number of similar unnamed faces shown as candidates in the "Add faces to a name" tab.\n\nDefault: %s.\n\nHigher values show more candidate faces to choose from, while lower values keep the grid smaller.
settings.tooltip.updateCheckEnabled=Whether Face Sort checks the project's GitHub repository for a newer release on application startup and shows a notice when one is available.\n\nDefault: %s.\n\nDisabling this also skips the network request at startup.
settings.enabled=enabled
settings.disabled=disabled

