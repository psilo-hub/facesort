settings.tooltip.minBoundingBoxSize=Longueur de côté minimale (en pixels) d'une boîte de visage détectée ; les visages plus petits sont ignorés lors de l'importation.\n\nPar défaut : %s px.\n\nDes valeurs plus élevées ne conservent que les visages plus grands (généralement plus proches), donc moins de faux positifs, mais les petits visages ou éloignés sont manqués. Des valeurs plus faibles conservent aussi les petits visages ou éloignés, ce qui ajoute du bruit et ralentit le traitement.
settings.tooltip.minConfidence=Score de confiance minimal qu'un visage détecté doit avoir pour être enregistré ; les détections en dessous sont ignorées lors de l'importation.\n\nPar défaut : %s.\n\nDes valeurs plus élevées n'acceptent que les détections très sûres, réduisant les faux positifs mais pouvant sauter de vrais visages. Des valeurs plus faibles conservent plus de visages, y compris incertains.
settings.tooltip.maxFacesPerImage=Nombre maximal de visages enregistrés par image importée. Lorsqu'une image contient plus de visages, seuls les plus fiables sont conservés.\n\nPar défaut : %s.\n\nDes valeurs plus élevées conservent plus de visages provenant de photos de groupe, au prix de plus de données. Des valeurs plus faibles enregistrent moins de visages et peuvent omettre des personnes sur des photos chargées.
settings.tooltip.clusteringThreshold=Similarité minimale entre deux visages sans nom pour qu'ils soient regroupés dans le même groupe dans l'onglet « Donner un nom à un visage ».\n\nPar défaut : %s.\n\nDes valeurs plus élevées ne regroupent que des visages très similaires, donnant des groupes plus petits et plus précis, mais une même personne peut être répartie dans plusieurs groupes. Des valeurs plus faibles fusionnent plus de visages et peuvent mélanger des personnes différentes.
settings.tooltip.hnswM=Nombre de liens conservés par nœud dans l'index HNSW utilisé pour trouver des visages similaires pendant le regroupement.\n\nPar défaut : %s.\n\nDes valeurs plus élevées améliorent la précision de la recherche de voisins au prix de plus de mémoire et d'un index plus lent à construire. Des valeurs plus faibles construisent plus vite et utilisent moins de mémoire, mais peuvent manquer de vrais voisins.
settings.tooltip.hnswEfConstruction=Combien de nœuds candidats HNSW considère lors de la construction des liens de chaque nœud. Un compromis entre le temps de construction et la qualité de la recherche.\n\nPar défaut : %s.\n\nDes valeurs plus élevées construisent un index plus précis mais prennent plus de temps et de mémoire. Des valeurs plus faibles construisent plus rapidement avec un index moins précis.
settings.tooltip.hnswEfSearch=Combien de nœuds candidats HNSW examine lors de chaque recherche de voisin effectuée au moment du regroupement.\n\nPar défaut : %s.\n\nDes valeurs plus élevées donnent des recherches plus précises mais plus lentes. Des valeurs plus faibles vont plus vite mais peuvent manquer de vrais voisins.
settings.tooltip.knnK=Nombre de voisins les plus proches interrogés pour chaque visage lors de la liaison des visages en groupes.\n\nPar défaut : %s.\n\nDes valeurs plus élevées peuvent connecter des visages plus éloignés dans un groupe, ce qui est plus lent et peut mélanger des personnes différentes. Des valeurs plus faibles vont plus vite mais ne relient que des visages très proches.
settings.tooltip.faceaiCacheDir=Répertoire où FaceAI stocke les modèles de détection et de reconnaissance de visage téléchargés. Les modèles sont récupérés à la première utilisation puis réutilisés depuis ce dossier.\n\nPar défaut : vide, ce qui utilise l'emplacement de cache intégré de FaceAI (par ex. ~/.djl.ai/cache).\n\nCe paramètre n'a pas de plage haute/basse : laissez-le vide pour l'emplacement par défaut ou saisissez un chemin pour contrôler où vivent les modèles.
settings.tooltip.maxDetectionDimension=Plus grande largeur/hauteur (en pixels) qu'une image peut avoir avant d'être réduite avant l'exécution de la détection de visage.\n\nPar défaut : %s px.\n\nDes valeurs plus élevées détectent plus fiablement les petits visages ou éloignés dans les énormes photos, mais utilisent plus de mémoire et prennent beaucoup plus de temps. Des valeurs plus faibles rendent la détection rapide et peu coûteuse sur les photos haute résolution, au risque de manquer de très petits visages.
settings.tooltip.thumbnailSize=Largeur/hauteur maximale (en pixels) de la vignette pleine image enregistrée pour chaque image importée.\n\nPar défaut : %s px.\n\nDes valeurs plus élevées donnent des aperçus plus nets mais des fichiers de base de données plus gros. Des valeurs plus faibles gardent la base de données plus petite au détriment de la qualité d'aperçu.
settings.tooltip.maxImportThreads=Nombre de threads de travail parallèles utilisés lors de l'importation de fichiers image. S'applique à la prochaine importation.\n\nPar défaut : %s.\n\nDes valeurs plus élevées importent plus vite sur les machines multicœurs mais augmentent l'utilisation du processeur et de la mémoire. Des valeurs plus faibles sont plus douces pour le système mais plus lentes.
settings.tooltip.minNameSimilarity=Similarité minimale avec l'embedding moyen d'un nom pour qu'un visage soit proposé lors de l'ajout de visages à un nom existant dans l'onglet « Ajouter des visages à un nom ».\n\nPar défaut : %s.\n\nDes valeurs plus élevées n'acceptent que des visages très similaires, évitant de mauvais ajouts. Des valeurs plus faibles proposent plus de candidats mais risquent d'ajouter une autre personne.
settings.tooltip.faceNameMaxImages=Nombre maximal de visages sans nom similaires affichés comme candidats dans l'onglet « Ajouter des visages à un nom ».\n\nPar défaut : %s.\n\nDes valeurs plus élevées affichent plus de visages candidats, tandis que des valeurs plus faibles gardent la grille plus petite.
settings.tooltip.updateCheckEnabled=Vérifie si Face Sort recherche le dépôt GitHub du projet pour une nouvelle version au démarrage de l'application et affiche un avis lorsqu'une est disponible.\n\nPar défaut : %s.\n\nLa désactivation ignore également la requête réseau au démarrage.
