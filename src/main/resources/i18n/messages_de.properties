settings.tooltip.minBoundingBoxSize=Minimale Seitenlänge (in Pixeln) einer erkannten Gesichtsbox; Gesichter, die kleiner sind, werden beim Import verworfen.\n\nStandard: %s px.\n\nHöhere Werte behalten nur größere (meist nähere) Gesichter, dadurch weniger Fehltreffer, aber kleine oder entfernte Gesichter werden übersehen. Niedrigere Werte behalten auch kleine oder entfernte Gesichter, was Rauschen hinzufügt und die Verarbeitung verlangsamt.
settings.tooltip.minConfidence=Mindestkonfidenzwert, den ein erkanntes Gesicht haben muss, um gespeichert zu werden; Erkennungen darunter werden beim Import verworfen.\n\nStandard: %s.\n\nHöhere Werte akzeptieren nur sehr sichere Erkennungen, reduzieren Fehltreffer, überspringen aber möglicherweise echte Gesichter. Niedrigere Werte behalten mehr Gesichter, auch unsichere.
settings.tooltip.maxFacesPerImage=Maximale Anzahl an Gesichtern, die pro importiertem Bild gespeichert werden. Wenn ein Bild mehr Gesichter enthält, werden nur die sichersten behalten.\n\nStandard: %s.\n\nHöhere Werte behalten mehr Gesichter von Gruppenfotos, auf Kosten von mehr Daten. Niedrigere Werte speichern weniger Gesichter und können Personen in vollen Bildern verfehlen.
settings.tooltip.clusteringThreshold=Mindestähnlichkeit zwischen zwei unbenannten Gesichtern, damit sie im Tab „Einem Gesicht einen Namen geben" demselben Cluster zugeordnet werden.\n\nStandard: %s.\n\nHöhere Werte gruppieren nur sehr ähnliche Gesichter, was kleinere und präzisere Cluster ergibt, aber eine Person kann in mehrere Cluster aufgeteilt werden. Niedrigere Werte fassen mehr Gesichter zusammen und können verschiedene Personen mischen.
settings.tooltip.hnswM=Anzahl der Verbindungen, die pro Knoten im HNSW-Index gehalten werden, der zur Suche ähnlicher Gesichter beim Clustering verwendet wird.\n\nStandard: %s.\n\nHöhere Werte verbessern die Genauigkeit der Nachbarsuche auf Kosten von mehr Speicher und langsamerem Indexaufbau. Niedrigere Werte bauen schneller und verbrauchen weniger Speicher, können aber echte Nachbarn übersehen.
settings.tooltip.hnswEfConstruction=Wie viele Kandidatenknoten HNSW beim Aufbau der Verbindungen jedes Knotens berücksichtigt. Ein Kompromiss zwischen Indexaufbauzeit und Suchqualität.\n\nStandard: %s.\n\nHöhere Werte bauen einen genaueren Index, brauchen aber länger und mehr Speicher. Niedrigere Werte bauen schneller mit einem weniger genauen Index.
settings.tooltip.hnswEfSearch=Wie viele Kandidatenknoten HNSW bei jeder Nachbarsuche während des Clustering prüft.\n\nStandard: %s.\n\nHöhere Werte liefern genauere Suchen, laufen aber langsamer. Niedrigere Werte laufen schneller, können aber echte Nachbarn übersehen.
settings.tooltip.knnK=Anzahl der nächsten Nachbarn, die für jedes Gesicht abgefragt werden, wenn Gesichter zu Clustern verknüpft werden.\n\nStandard: %s.\n\nHöhere Werte können weiter entfernte Gesichter in einen Cluster verbinden, was langsamer ist und verschiedene Personen vermischen kann. Niedrigere Werte laufen schneller, verknüpfen aber nur sehr nahe Gesichter.
settings.tooltip.faceaiCacheDir=Verzeichnis, in dem FaceAI die heruntergeladenen Gesichtserkennungs- und Erkennungsmodelle speichert. Die Modelle werden bei der ersten Verwendung abgerufen und danach aus diesem Ordner wiederverwendet.\n\nStandard: leer, dann wird der eingebaute FaceAI-Cachespeicherort verwendet (z. B. ~/.djl.ai/cache).\n\nDiese Einstellung hat keinen höher/niedriger-Bereich: Leer lassen für den Standardort oder einen Pfad eingeben, um zu steuern, wo die Modelle liegen.
settings.tooltip.maxDetectionDimension=Größte Breite/Höhe (in Pixeln), die ein Bild haben darf, bevor es vor der Gesichtserkennung verkleinert wird.\n\nStandard: %s px.\n\nHöhere Werte erkennen kleine oder entfernte Gesichter in riesigen Fotos zuverlässiger, brauchen aber mehr Speicher und dauern viel länger. Niedrigere Werte machen die Erkennung bei hochauflösenden Fotos schnell und günstig, mit dem Risiko, sehr kleine Gesichter zu übersehen.
settings.tooltip.thumbnailSize=Maximale Breite/Höhe (in Pixeln) des Vollbild-Thumbnails, das für jedes importierte Bild gespeichert wird.\n\nStandard: %s px.\n\nHöhere Werte liefern schärfere Vorschaubilder, aber größere Datenbankdateien. Niedrigere Werte halten die Datenbank kleiner, auf Kosten der Vorschauqualität.
settings.tooltip.thumbnailQuality=JPEG-Qualität für jedes gespeicherte Vorschaubild und Gesichts-Unterbild. Gültiger Bereich: 0,1 bis 1,0.\n\nStandard: %s.\n\nHöhere Werte liefern schärfere Vorschaubilder, aber größere Datenbankdateien. Niedrigere Werte halten die Datenbank kleiner, auf Kosten der Vorschauqualität.
settings.tooltip.maxFramesPerVideo=Maximale Anzahl der pro importiertem Video extrahierten Frames, bei höchstens einem Frame pro Sekunde.\n\nStandard: %s.\n\nHöhere Werte decken lange Videos detaillierter ab, machen den Video-Import aber deutlich langsamer und speichern mehr Gesichter. Niedrigere Werte beschleunigen den Video-Import und sparen Speicherplatz, können aber kurz erscheinende Gesichter übersehen.
settings.tooltip.faceCropSize=Maximale Breite/Höhe (in Pixeln) des quadratischen Ausschnitts, der für jedes erkannte Gesicht nach der Verkleinerung gespeichert wird.\n\nStandard: %s px.\n\nHöhere Werte behalten mehr Details für Einbettung und Prüfung, vergrößern aber Datenbank und verlangsamen den Import. Niedrigere Werte speichern kleinere Gesichtsbilder, was die Erkennungs- und Zuordnungsqualität senken kann.
settings.tooltip.maxImportThreads=Anzahl der parallelen Arbeits-Threads beim Import von Bilddateien. Gilt für den nächsten Import.\n\nStandard: %s.\n\nHöhere Werte importieren auf Mehrkernrechnern schneller, erhöhen aber CPU- und Speichernutzung. Niedrigere Werte sind schonender fürs System, aber langsamer.
settings.tooltip.minNameSimilarity=Mindestähnlichkeit zur durchschnittlichen Einbettung eines Namens, damit ein Gesicht im Tab „Gesichter zu einem Namen hinzufügen" angeboten wird.\n\nStandard: %s.\n\nHöhere Werte erlauben nur sehr ähnliche Gesichter und vermeiden falsche Ergänzungen. Niedrigere Werte bieten mehr Kandidaten, riskieren aber das Hinzufügen einer anderen Person.
settings.tooltip.faceNameMaxImages=Maximale Anzahl ähnlicher unbenannter Gesichter, die als Kandidaten im Tab „Gesichter zu einem Namen hinzufügen" angezeigt werden.\n\nStandard: %s.\n\nHöhere Werte zeigen mehr Kandidatengesichter, niedrigere halten das Raster kleiner.
settings.tooltip.updateCheckEnabled=Ob Face Sort beim Start im GitHub-Repository des Projekts nach einer neueren Version sucht und einen Hinweis zeigt, wenn eine verfügbar ist.\n\nStandard: %s.\n\nDas Deaktivieren überspringt auch die Netzanfrage beim Start.
