settings.tooltip.minBoundingBoxSize=检测到的人脸框的最小边长（像素）；小于此值的人脸在导入时会被丢弃。\n\n默认值：%s 像素。\n\n较大的值只保留较大（通常较近）的人脸，误检更少，但会漏掉较小或较远的人脸。较小的值也会保留较小或较远的人脸，这会增加噪声并降低处理速度。
settings.tooltip.minConfidence=检测到的人脸必须达到的最低置信度分数才会被保存；低于此分数的检测结果在导入时会被丢弃。\n\n默认值：%s。\n\n较大的值只接受非常确定的检测结果，减少误检，但可能跳过真实人脸。较小的值会保留更多人脸，包括不确定的。
settings.tooltip.maxFacesPerImage=每张导入图片最多保存的人脸数。当图片包含更多人脸时，只保留置信度最高的那些。\n\n默认值：%s。\n\n较大的值会保留更多群体照片中的人脸，但需要更多数据。较小的值保存的人脸更少，可能在拥挤的照片中遗漏人物。
settings.tooltip.clusteringThreshold=两个未命名人脸被分到“为人脸命名”标签页中同一聚类的阈值。\n\n默认值：%s。\n\n较大的值只对非常相似的人脸聚类，聚类更小更精确，但同一个人可能会被分成多个聚类。较小的值会合并更多人脸，可能把不同的人混在一起。
settings.tooltip.hnswM=聚类时用于查找相似人脸的 HNSW 索引中每个节点保留的链接数。\n\n默认值：%s。\n\n较大的值可提高邻居搜索精度，但占用更多内存且索引构建更慢。较小的值构建更快、内存占用更少，但可能漏掉真正的邻居。
settings.tooltip.hnswEfConstruction=HNSW 在构建每个节点的链接时考虑的候选节点数量。在索引构建时间与搜索质量之间权衡。\n\n默认值：%s。\n\n较大的值构建的索引更精确，但耗时更长、占用内存更多。较小的值构建更快，但索引精度较低。
settings.tooltip.hnswEfSearch=HNSW 在聚类时每次邻居搜索中检查的候选节点数量。\n\n默认值：%s。\n\n较大的值搜索更精确，但运行更慢。较小的值运行更快，但可能漏掉真正的邻居。
settings.tooltip.knnK=将人脸链接到聚类时为每张人脸查询的最近邻居数量。\n\n默认值：%s。\n\n较大的值可将较远的人脸连接进同一个聚类，这更慢，并可能混入不同的人。较小的值运行更快，但只链接非常接近的人脸。
settings.tooltip.faceaiCacheDir=FaceAI 存储已下载的人脸检测与识别模型的目录。模型在首次使用时获取，之后从此文件夹复用。\n\n默认值：留空，则使用 FaceAI 内置缓存位置（例如 ~/.djl.ai/cache）。\n\n此设置没有高低范围：留空使用默认位置，或输入路径来控制模型的存放位置。
settings.tooltip.maxDetectionDimension=一张图片在进行人脸检测前允许的最大宽度/高度（像素）。\n\n默认值：%s 像素。\n\n较大的值可在超大型照片中更可靠地检测小或远的人脸，但会占用更多内存且耗时更久。较小的值使高分辨率照片的检测快速省资源，但有漏掉极小人脸的风险。
settings.tooltip.thumbnailSize=每张导入图片保存的整图缩略图的最大宽度/高度（像素）。\n\n默认值：%s 像素。\n\n较大的值预览更清晰，但数据库文件更大。较小的值数据库更小，但预览质量下降。
settings.tooltip.thumbnailQuality=每张已保存缩略图和脸部子图的 JPEG 质量。有效范围：0.1 到 1.0。\n\n默认值：%s。\n\n较大的值预览更清晰，但数据库文件更大。较小的值数据库更小，但预览质量下降。
settings.tooltip.maxFramesPerVideo=每个导入视频抽取的最大帧数，最多每秒一帧。\n\n默认值：%s。\n\n较大的值能更详细地覆盖长视频，但会显著减慢视频导入并保存更多脸部。较小的值加快视频导入并节省空间，但可能漏掉短暂出现的脸部。
settings.tooltip.faceCropSize=缩小后为每个检测到的脸部保存的方形裁剪的最大宽度/高度（像素）。\n\n默认值：%s 像素。\n\n较大的值保留更多细节以便嵌入和查看，但会增加数据库大小并减慢导入。较小的值保存更小的脸部图像，可能降低检测和识别质量。
settings.tooltip.maxImportThreads=导入图片文件时使用的并行工作线程数。适用于下一次导入。\n\n默认值：%s。\n\n在多核机器上，较大的值导入更快，但会增加 CPU 和内存占用。较小的值对系统更友好，但更慢。
settings.tooltip.minNameSimilarity=在“为名字添加人脸”标签页中，人脸要与名字的平均嵌入向量达到的最小相似度才会被提供。\n\n默认值：%s。\n\n较大的值只允许非常相似的人脸，避免错误添加。较小的值提供更多候选，但有添加错误人物的风险。
settings.tooltip.faceNameMaxImages=“为名字添加人脸”标签页中作为候选显示的相似未命名人脸的最大数量。\n\n默认值：%s。\n\n较大的值显示更多候选人脸，较小的值保持网格更小。
settings.tooltip.updateCheckEnabled=Face Sort 是否在应用程序启动时检查项目 GitHub 仓库是否有新版本，并在有可用版本时显示通知。\n\n默认值：%s。\n\n禁用此选项也会跳过启动时的网络请求。
