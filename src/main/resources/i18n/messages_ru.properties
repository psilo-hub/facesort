settings.tooltip.minBoundingBoxSize=Минимальная длина стороны (в пикселях) рамки обнаруженного лица; лица меньше этого значения отбрасываются при импорте.\n\nПо умолчанию: %s px.\n\nБолее высокие значения сохраняют только более крупные (обычно более близкие) лица, поэтому меньше ложных срабатываний, но мелкие или дальние лица пропускаются. Более низкие значения сохраняют и мелкие, и дальние лица, что добавляет шум и замедляет обработку.
settings.tooltip.minConfidence=Минимальный балл уверенности, который должно иметь обнаруженное лицо, чтобы быть сохранённым; обнаружения ниже этого значения отбрасываются при импорте.\n\nПо умолчанию: %s.\n\nБолее высокие значения принимают только очень уверенные обнаружения, сокращая ложные срабатывания, но возможно пропуская настоящие лица. Более низкие значения сохраняют больше лиц, включая неопределённые.
settings.tooltip.maxFacesPerImage=Максимальное число лиц, сохраняемых на каждое импортированное изображение. Если изображение содержит больше лиц, сохраняются только самые уверенные.\n\nПо умолчанию: %s.\n\nБолее высокие значения сохраняют больше лиц с групповых фото ценой большего объёма данных. Более низкие значения сохраняют меньше лиц и могут пропускать людей на переполненных снимках.
settings.tooltip.clusteringThreshold=Минимальное сходство между двумя безымянными лицами, чтобы они были сгруппированы в один кластер во вкладке «Присвоить имя лицу».\n\nПо умолчанию: %s.\n\nБолее высокие значения группируют только очень похожие лица, давая меньшие и более точные кластеры, но один человек может оказаться в нескольких кластерах. Более низкие значения объединяют больше лиц и могут смешивать разных людей.
settings.tooltip.hnswM=Число связей, сохраняемых на узел в индексе HNSW, используемом для поиска похожих лиц при кластеризации.\n\nПо умолчанию: %s.\n\nБолее высокие значения повышают точность поиска соседей ценой большего объёма памяти и более медленной сборки индекса. Более низкие значения собираются быстрее и используют меньше памяти, но могут пропускать настоящих соседей.
settings.tooltip.hnswEfConstruction=Сколько узлов-кандидатов HNSW рассматривает при построении связей каждого узла. Компромисс между временем построения индекса и качеством поиска.\n\nПо умолчанию: %s.\n\nБолее высокие значения строят более точный индекс, но дольше и с большим расходом памяти. Более низкие значения строят быстрее с менее точным индексом.
settings.tooltip.hnswEfSearch=Сколько узлов-кандидатов HNSW проверяет при каждом поиске соседей во время кластеризации.\n\nПо умолчанию: %s.\n\nБолее высокие значения дают более точный поиск, но работают медленнее. Более низкие значения работают быстрее, но могут пропускать настоящих соседей.
settings.tooltip.knnK=Число ближайших соседей, запрашиваемых для каждого лица при связывании лиц в кластеры.\n\nПо умолчанию: %s.\n\nБолее высокие значения могут объединить более далёкие лица в кластер, что медленнее и может смешать разных людей. Более низкие значения работают быстрее, но связывают только очень близкие лица.
settings.tooltip.faceaiCacheDir=Каталог, в котором FaceAI хранит загруженные модели обнаружения и распознавания лиц. Модели загружаются при первом использовании и затем переиспользуются из этой папки.\n\nПо умолчанию: пусто, используется встроенное расположение кэша FaceAI (например, ~/.djl.ai/cache).\n\nУ этой настройки нет диапазона выше/ниже: оставьте поле пустым для расположения по умолчанию или укажите путь, чтобы управлять размещением моделей.
settings.tooltip.maxDetectionDimension=Наибольшая ширина/высота (в пикселях), которую может иметь изображение, прежде чем оно будет уменьшено перед распознаванием лиц.\n\nПо умолчанию: %s px.\n\nБолее высокие значения надёжнее обнаруживают мелкие или дальние лица на огромных фото, но используют больше памяти и работают значительно дольше. Более низкие значения делают распознавание быстрым и недорогим на снимках высокого разрешения, но есть риск пропустить очень мелкие лица.
settings.tooltip.thumbnailSize=Максимальная ширина/высота (в пикселях) миниатюры полного изображения, сохраняемой для каждого импортированного изображения.\n\nПо умолчанию: %s px.\n\nБолее высокие значения дают более чёткий предпросмотр, но файл базы данных больше. Более низкие значения делают базу данных меньше в ущерб качеству предпросмотра.
settings.tooltip.maxImportThreads=Число параллельных рабочих потоков, используемых при импорте файлов изображений. Применяется к следующему импорту.\n\nПо умолчанию: %s.\n\nБолее высокие значения импортируют быстрее на многоядерных машинах, но увеличивают нагрузку на ЦП и память. Более низкие значения бережнее относятся к системе, но медленнее.
settings.tooltip.minNameSimilarity=Минимальное сходство со средним вложением имени, чтобы лицо предлагалось при добавлении лиц к существующему имени во вкладке «Добавить лица к имени».\n\nПо умолчанию: %s.\n\nБолее высокие значения допускают только очень похожие лица, избегая ошибочных добавлений. Более низкие значения предлагают больше кандидатов, но рискуют добавить другого человека.
settings.tooltip.faceNameMaxImages=Максимальное число похожих безымянных лиц, показываемых как кандидаты во вкладке «Добавить лица к имени».\n\nПо умолчанию: %s.\n\nБолее высокие значения показывают больше кандидатов, а более низкие держат сетку меньше.
settings.tooltip.updateCheckEnabled=Проверяет ли Face Sort репозиторий проекта на GitHub на наличие новой версии при запуске приложения и показывает уведомление, если она доступна.\n\nПо умолчанию: %s.\n\nОтключение также пропускает сетевой запрос при запуске.
