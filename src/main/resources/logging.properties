# FaceSort logging configuration
handlers=java.util.logging.ConsoleHandler,java.util.logging.FileHandler

# Default logging level
.level=INFO

# Console handler configuration
java.util.logging.ConsoleHandler.level=INFO
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter

# File handler configuration
java.util.logging.FileHandler.level=WARNING
java.util.logging.FileHandler.pattern=%h/facesort%u.log
java.util.logging.FileHandler.limit=5000000
java.util.logging.FileHandler.count=3
java.util.logging.FileHandler.append=true
java.util.logging.FileHandler.formatter=java.util.logging.SimpleFormatter

# SimpleFormatter format
java.util.logging.SimpleFormatter.format=%1$tY-%1$tm-%1$td %1$tH:%1$tM:%1$tS %4$s %2$s %5$s%6$s%n

# Package-specific levels
free.svoss.facesort.level=INFO
free.svoss.facesort.ui.level=WARNING
free.svoss.facesort.service.level=INFO
free.svoss.facesort.db.level=INFO
free.svoss.facesort.update.level=INFO
