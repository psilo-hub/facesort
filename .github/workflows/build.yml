name: Build and Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-fat:
    name: Build fat jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache ~/.m2
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: m2-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-
      - name: Install FaceAI dependency
        shell: bash
        run: |
          git clone --depth 1 https://github.com/psilo-hub/FaceAI.git faceai-deps
          mvn -B install -DskipTests -f faceai-deps/pom.xml
      - name: Install ffmpeg4j dependency
        shell: bash
        run: |
          git clone --depth 1 https://github.com/Manevolent/ffmpeg4j.git ffmpeg4j-deps
          git -C ffmpeg4j-deps fetch --depth 1 origin 30d9a734a982b9b8a36e5cc800c4994d7e5c51ed
          git -C ffmpeg4j-deps checkout 30d9a734a982b9b8a36e5cc800c4994d7e5c51ed
          mvn -B install -DskipTests -f ffmpeg4j-deps/pom.xml
      # shell: bash is required: Windows runners default to pwsh, whose parser
      # splits dotted -D properties (e.g. -Dbuild.number=...) at the dot and
      # hands Maven a bogus lifecycle phase instead.
      - run: mvn -B package -DskipTests -Dbuild.number=build-${{ github.run_number }}
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: facesort-fat
          path: target/facesort-1.0-SNAPSHOT.jar
          if-no-files-found: error

  build-platform:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
          - platform: mac-aarch64
            os: macos-latest
          - platform: mac-x86_64
            os: macos-15-intel
          - platform: win-x86_64
            os: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache ~/.m2
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: m2-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-
      - name: Install FaceAI dependency
        shell: bash
        run: |
          git clone --depth 1 https://github.com/psilo-hub/FaceAI.git faceai-deps
          mvn -B install -DskipTests -f faceai-deps/pom.xml
      - name: Install ffmpeg4j dependency
        shell: bash
        run: |
          git clone --depth 1 https://github.com/Manevolent/ffmpeg4j.git ffmpeg4j-deps
          git -C ffmpeg4j-deps fetch --depth 1 origin 30d9a734a982b9b8a36e5cc800c4994d7e5c51ed
          git -C ffmpeg4j-deps checkout 30d9a734a982b9b8a36e5cc800c4994d7e5c51ed
          mvn -B install -DskipTests -f ffmpeg4j-deps/pom.xml
      - name: Build platform jar
        # shell: bash is required: the Windows runner defaults to pwsh, whose
        # parser splits dotted -D properties (-Dbuild.number=...) at the dot, so
        # Maven receives ".number=build-N" as a lifecycle phase and fails before
        # it compiles anything.
        #
        # Do NOT add -Djavafx.platform here. OpenJFX picks the platform artifact
        # from the runner's own OS and CPU through its built-in profiles, which
        # is exactly what these native jobs need. Passing the property as a user
        # property activates OpenJFX's "javafx.platform.custom" profile, whose
        # <javafx.platform>${javafx.platform}</javafx.platform> is a
        # self-reference that Maven 3.10+ rejects as a "recursive expression
        # cycle". OpenJFX's POM then counts as invalid, its classified - and only
        # non-empty - jar is dropped, and every javafx.* import fails to compile.
        shell: bash
        run: mvn -B package -P${{ matrix.platform }} -DskipTests -Dbuild.number=build-${{ github.run_number }}
      - uses: actions/upload-artifact@v7
        with:
          name: facesort-${{ matrix.platform }}
          path: target/facesort-1.0-SNAPSHOT-${{ matrix.platform }}.jar
          if-no-files-found: error

  release:
    name: Create Release
    needs: [ build-fat, build-platform ]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: artifacts/*
          generate_release_notes: true