name: Build and Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-fat:
    name: Build fat jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache ~/.m2
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: m2-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-
      - name: Install FaceAI dependency
        shell: bash
        run: |
          git clone --depth 1 https://github.com/psilo-hub/FaceAI.git faceai-deps
          mvn -B install -DskipTests -f faceai-deps/pom.xml
      - name: Install rawGitHubFetcher dependency
        shell: bash
        run: |
          git clone --depth 1 https://github.com/psilo-hub/rawGitHubFetcher.git rawgithubfetcher-deps
          mvn -B install -DskipTests -f rawgithubfetcher-deps/pom.xml
      - name: Install ffmpeg4j dependency
        shell: bash
        run: |
          git clone --depth 1 https://github.com/Manevolent/ffmpeg4j.git ffmpeg4j-deps
          git -C ffmpeg4j-deps fetch --depth 1 origin 30d9a734a982b9b8a36e5cc800c4994d7e5c51ed
          git -C ffmpeg4j-deps checkout 30d9a734a982b9b8a36e5cc800c4994d7e5c51ed
          mvn -B install -DskipTests -f ffmpeg4j-deps/pom.xml
      - run: mvn -B package -DskipTests
      - uses: actions/upload-artifact@v5
        with:
          name: facesort-fat
          path: target/facesort-1.0-SNAPSHOT.jar
          if-no-files-found: error

  build-platform:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
            javafx-platform: linux
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            javafx-platform: linux-aarch64
          - platform: mac-aarch64
            os: macos-latest
            javafx-platform: mac-aarch64
          - platform: mac-x86_64
            os: macos-15-intel
            javafx-platform: mac
          - platform: win-x86_64
            os: windows-latest
            javafx-platform: win
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache ~/.m2
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: m2-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-
      - name: Install FaceAI dependency
        shell: bash
        run: |
          git clone --depth 1 https://github.com/psilo-hub/FaceAI.git faceai-deps
          mvn -B install -DskipTests -f faceai-deps/pom.xml
      - name: Install rawGitHubFetcher dependency
        shell: bash
        run: |
          git clone --depth 1 https://github.com/psilo-hub/rawGitHubFetcher.git rawgithubfetcher-deps
          mvn -B install -DskipTests -f rawgithubfetcher-deps/pom.xml
      - name: Install ffmpeg4j dependency
        shell: bash
        run: |
          git clone --depth 1 https://github.com/Manevolent/ffmpeg4j.git ffmpeg4j-deps
          git -C ffmpeg4j-deps fetch --depth 1 origin 30d9a734a982b9b8a36e5cc800c4994d7e5c51ed
          git -C ffmpeg4j-deps checkout 30d9a734a982b9b8a36e5cc800c4994d7e5c51ed
          mvn -B install -DskipTests -f ffmpeg4j-deps/pom.xml
      - name: Build platform jar
        run: mvn -B package -P${{ matrix.platform }} "-Djavafx.platform=${{ matrix.javafx-platform }}" -DskipTests
      - uses: actions/upload-artifact@v5
        with:
          name: facesort-${{ matrix.platform }}
          path: target/facesort-1.0-SNAPSHOT-${{ matrix.platform }}.jar
          if-no-files-found: error

  release:
    name: Create Release
    needs: [ build-fat, build-platform ]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts/
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: artifacts/*
          generate_release_notes: true